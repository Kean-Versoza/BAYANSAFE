{% extends "base.html" %}

{% block content %}
<main class="register-page">
    
    <!-- Big Yellow Action Landing Button -->
    <button type="button" class="btn-yellow main-trigger" id="openFormBtn">
        REGISTER NOW
    </button>

    <!-- Registration Card Form -->
    <form class="reg-form hidden-form" id="regCardForm" action="#" method="POST">
        <p class="form-title">CREATE ACCOUNT</p>
        
        <input type="text" placeholder="Username" required>
        <input type="email" placeholder="Email Address" required>
        
        <!-- Password Container Box with Eye Toggle -->
        <div class="password-wrapper">
            <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="toggle-password-eye" data-target="password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5"/>
                    </svg>

                    <svg class="icon-eye-off" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 13c-1.01 0-1.932-.18-2.761-.471l1.712-1.713c.322.12.67.184 1.031.184c1.65 0 3-1.35 3-3c0-.362-.064-.71-.183-1.031l2.285-2.285a11.7 11.7 0 0 1 2.729 2.736a.99.99 0 0 1 0 1.16C15.084 9.62 12.37 13 8 13m1.039-7.807l1.722-1.722A8.3 8.3 0 0 0 8 3C3.63 3 .916 6.38.187 7.42a.99.99 0 0 0 0 1.16c.382.544 1.307 1.73 2.729 2.736l2.26-2.26A3 3 0 0 1 4.982 8c0-1.65 1.35-3 3-3c.372 0 .728.068 1.057.193m-7.185 9.661a.5.5 0 0 1-.708-.708l13-13a.5.5 0 0 1 .708.708zM7.78 9.988A2 2 0 0 0 9.988 7.78zm.44-3.976A2 2 0 0 0 6.012 8.22z"/>
                    </svg>
                </button>
        </div>
        
        <label class="terms">
            <input type="checkbox" required> I agree to the safety terms
        </label>
        
        <button type="submit" class="btn-submit">SUBMIT</button>
    </form>

    <!-- Bottom Page Footer Tagline Section -->
    <div class="tagline">
        <p>A Philippine Smart Community Disaster Intelligence and Preparedness Response Game</p>
    </div>
</main>

<script>
    // 1. Landing button opens the registration card
    document.getElementById('openFormBtn').addEventListener('click', function () {
        this.style.display = 'none';
        document.getElementById('regCardForm').classList.remove('hidden-form');
    });

    // 2. Show / hide password (works for every password field)
    document.querySelectorAll('.toggle-password-eye').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = btn.parentElement.querySelector('input');
            var show = input.type === 'password';

            input.type = show ? 'text' : 'password';
            btn.classList.toggle('is-visible', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    });
</script>
{% endblock %}

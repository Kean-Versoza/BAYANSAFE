{% extends "base.html" %}

{% block content %}
<main class="register-page">
    
    <!-- Big Yellow Action Landing Button -->
    <button type="button" class="btn-yellow main-trigger" id="openFormBtn">
        REGISTER NOW
    </button>

    <!-- Registration Card Form -->
    <form class="reg-form hidden-form" id="regCardForm" action="#" method="POST">
        <p class="form-title">CREATE ACCOUNT</p>
        
        <input type="text" placeholder="Username" required>
        <input type="email" placeholder="Email Address" required>
        
        <!-- Password Container Box with Eye Toggle -->
        <div class="password-wrapper">
            <input type="password" id="passwordField" placeholder="Password" required>
            <button type="button" id="togglePasswordBtn" class="toggle-password-eye" aria-label="Toggle password visibility">
                👁️
            </button>
        </div>
        
        <label class="terms">
            <input type="checkbox" required> I agree to the safety terms
        </label>
        
        <button type="submit" class="btn-submit">SUBMIT</button>
    </form>

    <!-- Bottom Page Footer Tagline Section -->
    <div class="tagline">
        <p>A Philippine Smart Community Disaster Intelligence and Preparedness Response Game</p>
    </div>
</main>

<script>
    // 1. Landing Button Trigger Logic
    document.getElementById('openFormBtn').addEventListener('click', function() {
        this.style.display = 'none';
        document.getElementById('regCardForm').classList.remove('hidden-form');
    });

    // 2. Password Show / Hide Visibility Logic
    const passwordField = document.getElementById('passwordField');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    togglePasswordBtn.addEventListener('click', function() {
        // Toggle the input type attribute between text and password
        const isPassword = passwordField.getAttribute('type') === 'password';
        passwordField.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Update the visual representation indicator icon smoothly
        this.textContent = isPassword ? '🙈' : '👁️';
    });
</script>

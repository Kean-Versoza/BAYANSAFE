<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayanSafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="frame {{ 'frame-home' if page == 'home' else 'frame-inner' }}">

        <header class="topbar">
            {% if page != 'home' %}
            <a class="logo" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BAYANSAFE"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            </a>
            {% endif %}

            <nav class="nav-pill">
                <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'home' }}">HOME</a>
                <a href="{{ url_for('about') }}" class="{{ 'active' if page == 'about' }}">ABOUT</a>
                <a href="{{ url_for('registration') }}" class="{{ 'active' if page == 'registration' }}">REGISTRATION</a>
            </nav>
        </header>

        {% block content %}{% endblock %}
    </div>
</body>
</html>

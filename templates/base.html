<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayanSafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{{ page }}">
    <div class="frame {{ 'frame-home' if page == 'home' else 'frame-inner' }}">

        <header class="topbar">
            {% if page != 'home' %}
            <a class="logo" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BAYANSAFE"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            </a>
            {% endif %}

            <nav class="nav-pill">
                <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'home' }}">HOME</a>
                <a href="{{ url_for('about') }}" class="{{ 'active' if page == 'about' }}">ABOUT</a>
                <a href="{{ url_for('registration') }}" class="{{ 'active' if page == 'registration' }}">REGISTER</a>
            </nav>
        </header>

        {% block content %}{% endblock %}
    </div>

            <!-- Skeleton loader shown between pages -->
            <div id="pageSkeleton" class="page-skeleton is-active" data-view="home" aria-hidden="true">

                <!-- Nav bar + brand logo (logo is hidden on Home, like the real page) -->
                <div class="sk-topbar">
                    <div class="sk sk-logo"></div>
                    <div class="sk-nav">
                        <span class="sk"></span>
                        <span class="sk"></span>
                        <span class="sk"></span>
                    </div>
                </div>

                <!-- Home -->
                <div class="sk-view sk-home">
                    <div class="sk sk-sign"></div>
                    <div class="sk-tag">
                        <div class="sk-tl"><div class="sk sk-tbar sk-t1"></div></div>
                        <div class="sk-tl"><div class="sk sk-tbar sk-t2"></div></div>
                    </div>
                </div>

                <!-- About -->
                <div class="sk-view sk-about">
                    <div class="sk-card">
                        <div class="sk-para">
                            <div class="sk sk-line sk-w-80"></div>
                            <div class="sk sk-line sk-w-90"></div>
                            <div class="sk sk-line sk-w-50"></div>
                        </div>
                        <div class="sk-para">
                            <div class="sk sk-line sk-w-full"></div>
                            <div class="sk sk-line sk-w-90"></div>
                            <div class="sk sk-line sk-w-70"></div>
                        </div>
                        <div class="sk-cols">
                            <div class="sk-col">
                                <div class="sk-hd"><div class="sk sk-line sk-w-50"></div></div>
                                <div class="sk sk-line sk-li sk-w-70"></div>
                                <div class="sk sk-line sk-li sk-w-90"></div>
                                <div class="sk sk-line sk-li sk-w-80"></div>
                                <div class="sk sk-line sk-li sk-w-70"></div>
                                <div class="sk sk-line sk-li sk-w-80"></div>
                            </div>
                            <div class="sk-col">
                                <div class="sk-hd"><div class="sk sk-line sk-w-50"></div></div>
                                <div class="sk sk-line sk-w-90"></div>
                                <div class="sk sk-line sk-li sk-w-60"></div>
                                <div class="sk sk-line sk-w-70"></div>
                                <div class="sk sk-line sk-li sk-w-60"></div>
                                <div class="sk sk-line sk-w-60"></div>
                                <div class="sk sk-line sk-li sk-w-70"></div>
                                <div class="sk sk-line sk-li sk-w-50"></div>
                                <div class="sk sk-line sk-w-60"></div>
                                <div class="sk sk-line sk-li sk-w-70"></div>
                                <div class="sk sk-line sk-w-60"></div>
                                <div class="sk sk-line sk-li sk-w-80"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Registration -->
                <div class="sk-view sk-register">
                    <div class="sk sk-btn"></div>
                    <div class="sk-tag">
                        <div class="sk-tl"><div class="sk sk-tbar sk-t1"></div></div>
                        <div class="sk-tl"><div class="sk sk-tbar sk-t2"></div></div>
                    </div>
                </div>
            </div>

            <noscript><style>.page-skeleton { display: none; }</style></noscript>

            <script>
            (function () {
                var sk = document.getElementById('pageSkeleton');
                if (!sk) return;

                var MIN_SHOW = 450;      // ms the skeleton stays up after a page loads (raise it for a longer animation)
                var LEAVE_DELAY = 300;   // ms the skeleton fades in before the next page opens

                sk.dataset.view = document.body.dataset.page || 'home';

                function hide() { sk.classList.remove('is-active'); }

                // Arriving: wait for the page to finish loading, then fade the skeleton out
                window.addEventListener('load', function () {
                    setTimeout(hide, Math.max(0, MIN_SHOW - performance.now()));
                });
                window.addEventListener('pageshow', function (e) { if (e.persisted) hide(); });  // back button
                setTimeout(hide, 4000);                                                          // safety net

                function viewFor(path) {
                    if (path.indexOf('about') > -1) return 'about';
                    if (path.indexOf('registration') > -1) return 'registration';
                    return 'home';
                }

                // Leaving: show the skeleton, then go to the next page
                document.querySelectorAll('.nav-pill a, .logo').forEach(function (link) {
                    link.addEventListener('click', function (e) {
                        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
                        var url = new URL(link.href, location.href);
                        if (url.origin !== location.origin || url.pathname === location.pathname) return;

                        e.preventDefault();
                        sk.dataset.view = viewFor(url.pathname);   // shows the skeleton of the page you're going to
                        sk.classList.add('is-active');
                        setTimeout(function () { window.location.href = url.href; }, LEAVE_DELAY);
                    });
                });
            })();
            </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayanSafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-section="home">

    <!-- Fixed nav: always visible while scrolling -->
    <nav class="nav-pill">
        <a href="#home" data-target="home" class="active">HOME</a>
        <a href="#about" data-target="about">ABOUT</a>
        <a href="#registration" data-target="registration">REGISTER</a>
    </nav>

    {% block content %}{% endblock %}

    <!-- KEEP your existing <div id="pageSkeleton" ...> ... </div> and <noscript> here -->

<script>
(function () {
    var sk = document.getElementById('pageSkeleton');
    var navLinks = document.querySelectorAll('.nav-pill a');
    var jumpLinks = document.querySelectorAll('a[data-target]');
    var sections = document.querySelectorAll('.section');

    /* ---- settings ---- */
    var SHOW_LOADER_ON_NAV = true;   // true: skeleton flashes when you use the nav. false: smooth scroll only
    var MIN_SHOW = 450;              // ms the skeleton stays after the page loads
    var LEAVE_DELAY = 300;           // ms the skeleton fades in before a nav jump
    var NAV_LOADER_MS = 400;         // ms the skeleton stays after a nav jump

    function viewFor(id) {
        id = (id || '').replace('#', '');
        return (id === 'about' || id === 'registration') ? id : 'home';
    }
    function show(view) {
        if (!sk) return;
        if (view) sk.dataset.view = view;
        sk.classList.add('is-active');
    }
    function hide() { if (sk) sk.classList.remove('is-active'); }

    function setActive(id) {
        document.body.dataset.section = id;
        navLinks.forEach(function (a) {
            a.classList.toggle('active', a.dataset.target === id);
        });
    }

    /* 1. Loader on first load, reload, or opening the site */
    if (sk) sk.dataset.view = viewFor(location.hash);
    window.addEventListener('load', function () {
        setTimeout(hide, Math.max(0, MIN_SHOW - performance.now()));
    });
    setTimeout(hide, 4000);   // safety net

    /* 2. Back / forward buttons restore the page from memory: replay the loader */
    window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        show(viewFor(document.body.dataset.section));
        setTimeout(hide, MIN_SHOW);
    });

    /* 3. The yellow nav tab follows the section on screen */
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) setActive(en.target.id);
            });
        }, { rootMargin: '-45% 0px -45% 0px' });
        sections.forEach(function (s) { io.observe(s); });
    }

    /* 4. Nav tabs and the logo jump to their section */
    jumpLinks.forEach(function (link) {
        link.addEventListener('click', function (e) {
            var id = link.dataset.target;
            var target = document.getElementById(id);
            if (!target) return;
            e.preventDefault();

            if (SHOW_LOADER_ON_NAV && sk && document.body.dataset.section !== id) {
                show(id);
                setTimeout(function () {
                    window.scrollTo({ top: target.offsetTop, behavior: 'instant' });
                    setActive(id);
                    setTimeout(hide, NAV_LOADER_MS);
                }, LEAVE_DELAY);
            } else {
                target.scrollIntoView({ behavior: 'smooth' });
            }
            history.replaceState(null, '', '#' + id);
        });
    });

    /* 5. Registration: open the form */
    var openBtn = document.getElementById('openFormBtn');
    var regForm = document.getElementById('regCardForm');
    if (openBtn && regForm) {
        openBtn.addEventListener('click', function () {
            openBtn.style.display = 'none';
            regForm.classList.remove('hidden-form');
        });
    }

    /* 6. Show / hide password (works for every password field) */
    document.querySelectorAll('.toggle-password-eye').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = btn.parentElement.querySelector('input');
            var showPw = input.type === 'password';
            input.type = showPw ? 'text' : 'password';
            btn.classList.toggle('is-visible', showPw);
            btn.setAttribute('aria-label', showPw ? 'Hide password' : 'Show password');
        });
    });
})();
</script>
</body>
</html>
